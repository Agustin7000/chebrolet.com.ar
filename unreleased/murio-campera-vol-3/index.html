<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Murió Campera Vol. 3</title>
<style>
:root{--bg:#090909;--panel:#121212;--line:#272727;--text:#f5f5f5;--muted:#8c8c8c;--accent:#EA0000}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(100%,760px);margin:auto;padding:32px 18px 130px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-size:12px;letter-spacing:.18em;font-weight:800}.private{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:7px 10px;border-radius:999px}.hero{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:end;margin-bottom:34px}.cover{width:100%;aspect-ratio:1;object-fit:cover;background:#171717;border-radius:5px}.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.title{font-size:34px;line-height:1.03;letter-spacing:-.035em;font-weight:750;margin:0}.artist{color:var(--muted);font-size:15px;margin-top:10px}.tracks{border-top:1px solid var(--line)}.track{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;min-height:64px;border-bottom:1px solid var(--line);cursor:pointer;padding:0 8px 0 2px;transition:background .15s}.track:hover,.track.active{background:var(--panel)}.track.active .name{color:#fff}.track.active .num{color:var(--accent)}.num{color:var(--muted);font-size:13px;text-align:center}.name{font-size:14px;font-weight:600}.sub{font-size:12px;color:var(--muted);margin-top:3px}.dur{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}.player{position:fixed;left:0;right:0;bottom:0;background:rgba(13,13,13,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.progress{height:3px;background:#333;cursor:pointer}.fill{height:100%;width:0;background:var(--accent)}.playerin{height:84px;width:min(100%,760px);margin:auto;padding:0 18px;display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center}.play{border:0;background:#fff;color:#000;width:42px;height:42px;border-radius:50%;font-size:16px;cursor:pointer}.nowname{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}.controls{display:flex;gap:8px}.small{border:0;background:transparent;color:#bbb;font-size:18px;cursor:pointer;padding:8px}@media(max-width:600px){.wrap{padding-top:20px}.hero{grid-template-columns:1fr;gap:18px;align-items:start}.cover{max-width:100%}.title{font-size:30px}.top{margin-bottom:20px}.playerin{height:76px}.controls{display:none}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="brand">CHEBROLET / UNRELEASED</div><div class="private">PRIVATE LINK</div></div>
<section class="hero">
<img class="cover" src="assets/Murio%20Campera%20Vol.%203%20-%20Cover.jpg" alt="Cover Murió Campera Vol. 3">
<div><div class="eyebrow">Unreleased · 5 tracks</div><h1 class="title">Murió Campera<br>Vol. 3</h1><div class="artist">Chebrolet</div></div>
</section>
<div class="tracks" id="tracks"></div>
</main>
<div class="player">
<div class="progress" id="progress"><div class="fill" id="fill"></div></div>
<div class="playerin"><button class="play" id="play">▶</button><div><div class="nowname" id="now">Elegí un tema</div><div class="time"><span id="current">0:00</span> / <span id="total">0:00</span></div></div><div class="controls"><button class="small" id="prev">‹</button><button class="small" id="next">›</button></div></div>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const songs=[
 {name:'Fiesta Reggaeton',src:'assets/Muri%C3%B3%20Campera%20Vol.%203%20-%20Fiesta%20Reggaeton.mp3'},
 {name:'Las guachas',src:'assets/Muri%C3%B3%20Campera%20Vol.%203%20-%20Las%20guachas.mp3'},
 {name:'Te traje flores',src:'assets/Muri%C3%B3%20Campera%20Vol.%203%20-%20Te%20traje%20flores.mp3'},
 {name:'Que explote el parlante',src:'assets/Muri%C3%B3%20Campera%20Vol.%203%20-%20Que%20explote%20el%20parlante.mp3'},
 {name:'Karma',src:'assets/Muri%C3%B3%20Campera%20Vol.%203%20-%20Karma.mp3'}
];
const audio=document.querySelector('#audio'),tracks=document.querySelector('#tracks'),play=document.querySelector('#play'),now=document.querySelector('#now'),fill=document.querySelector('#fill'),progress=document.querySelector('#progress'),current=document.querySelector('#current'),total=document.querySelector('#total');let active=-1;
const fmt=s=>!isFinite(s)?'0:00':`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
songs.forEach((s,i)=>{const el=document.createElement('div');el.className='track';el.innerHTML=`<div class="num">${String(i+1).padStart(2,'0')}</div><div><div class="name">${s.name}</div><div class="sub">Chebrolet</div></div><div class="dur" id="d${i}">—:—</div>`;el.onclick=()=>load(i,true);tracks.appendChild(el)});
function load(i,autoplay=false){active=i;audio.src=songs[i].src;now.textContent=songs[i].name;[...tracks.children].forEach((x,n)=>x.classList.toggle('active',n===i));if(autoplay)audio.play().catch(()=>{});}
play.onclick=()=>{if(active<0)load(0,true);else audio.paused?audio.play():audio.pause()};audio.onplay=()=>play.textContent='❚❚';audio.onpause=()=>play.textContent='▶';audio.ontimeupdate=()=>{current.textContent=fmt(audio.currentTime);fill.style.width=((audio.currentTime/audio.duration)||0)*100+'%'};audio.onloadedmetadata=()=>{total.textContent=fmt(audio.duration);if(active>=0)document.querySelector('#d'+active).textContent=fmt(audio.duration)};audio.onended=()=>{if(active<songs.length-1)load(active+1,true);else{audio.currentTime=0;audio.pause()}};progress.onclick=e=>{if(audio.duration)audio.currentTime=(e.offsetX/progress.clientWidth)*audio.duration};document.querySelector('#prev').onclick=()=>active>0&&load(active-1,true);document.querySelector('#next').onclick=()=>active<songs.length-1&&load(active+1,true);
</script>
</body>
</html>
