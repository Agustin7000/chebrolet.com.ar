<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Links | CHEBROLET</title>
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="profile" id="profile"></header>
    <nav class="socials" id="socials" aria-label="Redes sociales"></nav>
    <div id="sections"></div>
    <p class="status" id="status">Cargando…</p>
  </main>

  <script>
    const icons = {
      instagram: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none"/><circle cx="12" cy="12" r="4" fill="none"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>',
      tiktok: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 3v11.2a4.7 4.7 0 1 1-4-4.65v3.15a1.7 1.7 0 1 0 1 1.55V3h3Zm0 2.8c1.1 1.5 2.5 2.4 4.5 2.55v3.05A8 8 0 0 1 14 9.8Z"/></svg>',
      facebook: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.2 8.2V6.7c0-.7.5-.9 1-.9h2.3V2.2L14.4 2c-3.1 0-4.6 1.9-4.6 4.5v1.7H7v4h2.8V22h4.4v-9.8h3.2l.5-4Z"/></svg>',
      x: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3h4.7l4.25 5.67L17.8 3H20l-6.03 7.04L20.5 21h-4.7l-4.72-6.3L5.7 21H3.5l6.55-7.66L4 3Zm3.6 2 9.2 14h1.6L9.2 5H7.6Z"/></svg>',
      youtube: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z"/></svg>',
      spotify: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5A10.5 10.5 0 1 0 12 22.5 10.5 10.5 0 0 0 12 1.5Zm4.82 15.15a.65.65 0 0 1-.9.22c-2.46-1.5-5.56-1.84-9.2-1.01a.65.65 0 1 1-.29-1.27c3.98-.9 7.4-.51 10.17 1.18.31.19.41.58.22.88Zm1.29-2.87a.81.81 0 0 1-1.12.27c-2.82-1.73-7.12-2.23-10.45-1.22a.81.81 0 1 1-.47-1.55c3.81-1.16 8.55-.6 11.77 1.37.38.23.5.74.27 1.13Zm.11-2.99C14.84 8.78 9.27 8.6 6.04 9.57a.98.98 0 1 1-.56-1.87c3.71-1.11 9.86-.9 13.74 1.4a.98.98 0 0 1-1 1.69Z"/></svg>'
    };

    async function loadLinks() {
      const status = document.getElementById('status');
      try {
        const response = await fetch('./links.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('No se pudo cargar links.json');
        const data = await response.json();

        const profile = document.getElementById('profile');
        if (data.profile.image) {
          const img = document.createElement('img');
          img.src = data.profile.image;
          img.alt = `Logo de ${data.profile.name}`;
          profile.appendChild(img);
        }
        const h1 = document.createElement('h1');
        h1.textContent = data.profile.name;
        profile.appendChild(h1);
        if (data.profile.tagline) {
          const p = document.createElement('p');
          p.textContent = data.profile.tagline;
          profile.appendChild(p);
        }

        const socials = document.getElementById('socials');
        (data.socials || []).filter(item => item.active !== false).forEach(item => {
          const a = document.createElement('a');
          a.className = 'social-link';
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.setAttribute('aria-label', item.name);
          a.title = item.name;
          a.innerHTML = icons[item.icon] || item.name;
          socials.appendChild(a);
        });

        const sections = document.getElementById('sections');
        data.sections.forEach(sectionData => {
          const activeLinks = (sectionData.links || []).filter(link => link.active !== false);
          if (!activeLinks.length) return;
          const section = document.createElement('section');
          section.className = 'section';
          const title = document.createElement('h2');
          title.className = 'section-title';
          title.textContent = sectionData.title;
          section.appendChild(title);
          const list = document.createElement('div');
          list.className = 'links';

          activeLinks.forEach(linkData => {
            const a = document.createElement('a');
            a.className = sectionData.type === 'shows' ? 'link show-link' : 'link';
            a.href = linkData.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';

            if (sectionData.type === 'shows') {
              const main = document.createElement('span');
              main.className = 'show-main';
              main.textContent = `${linkData.city} · ${linkData.date} · ${linkData.venue}`;
              a.appendChild(main);
              if (linkData.description) {
                const description = document.createElement('span');
                description.className = 'show-description';
                description.textContent = linkData.description;
                a.appendChild(description);
              }
              if (linkData.lineup) {
                const lineup = document.createElement('span');
                lineup.className = 'show-lineup';
                lineup.textContent = linkData.lineup;
                a.appendChild(lineup);
              }
            } else {
              if (linkData.icon && icons[linkData.icon]) {
                const icon = document.createElement('span');
                icon.className = 'link-icon';
                icon.innerHTML = icons[linkData.icon];
                a.appendChild(icon);
              }
              const label = document.createElement('span');
              label.className = 'link-label';
              label.textContent = linkData.title;
              a.appendChild(label);
            }
            list.appendChild(a);
          });
          section.appendChild(list);
          sections.appendChild(section);
        });
        status.remove();
      } catch (error) {
        status.textContent = 'No se pudieron cargar los links.';
        console.error(error);
      }
    }
    loadLinks();
  </script>
</body>
</html>
