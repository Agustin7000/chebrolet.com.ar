<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Links | CHEBROLET</title>
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="profile" id="profile"></header>
    <nav class="socials" id="socials" aria-label="Redes sociales"></nav>

    <div class="accordions">
      <section class="accordion">
        <button class="accordion-toggle" type="button" aria-expanded="false" aria-controls="shows-panel">
          <span>ENTRADAS / PRÓXIMOS SHOWS</span><span class="accordion-arrow" aria-hidden="true">＋</span>
        </button>
        <div class="accordion-panel" id="shows-panel" hidden><div class="links" id="shows"></div></div>
      </section>

      <section class="accordion">
        <button class="accordion-toggle" type="button" aria-expanded="false" aria-controls="music-panel">
          <span>MÚSICA</span><span class="accordion-arrow" aria-hidden="true">＋</span>
        </button>
        <div class="accordion-panel" id="music-panel" hidden><div class="music-releases" id="music"></div></div>
      </section>
    </div>
    <p class="status" id="status">Cargando…</p>
  </main>

  <script>
    const icons = {
      instagram: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none"/><circle cx="12" cy="12" r="4" fill="none"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>',
      tiktok: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 3v11.2a4.7 4.7 0 1 1-4-4.65v3.15a1.7 1.7 0 1 0 1 1.55V3h3Zm0 2.8c1.1 1.5 2.5 2.4 4.5 2.55v3.05A8 8 0 0 1 14 9.8Z"/></svg>',
      facebook: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.2 8.2V6.7c0-.7.5-.9 1-.9h2.3V2.2L14.4 2c-3.1 0-4.6 1.9-4.6 4.5v1.7H7v4h2.8V22h4.4v-9.8h3.2l.5-4Z"/></svg>',
      x: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3h4.7l4.25 5.67L17.8 3H20l-6.03 7.04L20.5 21h-4.7l-4.72-6.3L5.7 21H3.5l6.55-7.66L4 3Zm3.6 2 9.2 14h1.6L9.2 5H7.6Z"/></svg>',
      youtube: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z"/></svg>',
      spotify: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5A10.5 10.5 0 1 0 12 22.5 10.5 10.5 0 0 0 12 1.5Zm4.82 15.15a.65.65 0 0 1-.9.22c-2.46-1.5-5.56-1.84-9.2-1.01a.65.65 0 1 1-.29-1.27c3.98-.9 7.4-.51 10.17 1.18.31.19.41.58.22.88Zm1.29-2.87a.81.81 0 0 1-1.12.27c-2.82-1.73-7.12-2.23-10.45-1.22a.81.81 0 1 1-.47-1.55c3.81-1.16 8.55-.6 11.77 1.37.38.23.5.74.27 1.13Zm.11-2.99C14.84 8.78 9.27 8.6 6.04 9.57a.98.98 0 1 1-.56-1.87c3.71-1.11 9.86-.9 13.74 1.4a.98.98 0 0 1-1 1.69Z"/></svg>'
    };

    function renderProfile(data){
      const profile=document.getElementById('profile');
      if(data.profile.image){const img=document.createElement('img');img.src=data.profile.image;img.alt=`Logo de ${data.profile.name}`;profile.appendChild(img);}
      const h1=document.createElement('h1');h1.textContent=data.profile.name;profile.appendChild(h1);
      if(data.profile.tagline){const p=document.createElement('p');p.textContent=data.profile.tagline;profile.appendChild(p);}
      const socials=document.getElementById('socials');
      (data.socials||[]).filter(x=>x.active!==false).forEach(item=>{const a=document.createElement('a');a.className='social-link';a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',item.name);a.title=item.name;a.innerHTML=icons[item.icon]||item.name;socials.appendChild(a);});
    }

    function renderShow(linkData,list){
      const comingSoon=linkData.status==='coming_soon';
      const item=document.createElement(comingSoon?'div':'a');item.className=`link show-link${comingSoon?' coming-soon':''}`;
      if(!comingSoon){item.href=linkData.url;item.target='_blank';item.rel='noopener noreferrer';}else item.setAttribute('aria-disabled','true');
      const main=document.createElement('span');main.className='show-main';main.textContent=[linkData.city,linkData.date,linkData.venue].filter(Boolean).join(' · ');item.appendChild(main);
      const text=[linkData.description,comingSoon?'ENTRADAS PRÓXIMAMENTE':null].filter(Boolean).join(' · ');
      if(text){const d=document.createElement('span');d.className='show-description';d.textContent=text;item.appendChild(d);}list.appendChild(item);
    }

    function renderRelease(release,list){
      const row=document.createElement('div');row.className='music-release';
      const title=document.createElement('span');title.className='music-title';title.textContent=release.title;row.appendChild(title);
      const platforms=document.createElement('div');platforms.className='music-platforms';
      if(release.youtubeId){const yt=document.createElement('a');yt.className='music-platform';yt.href=`../music/youtube.html?v=${encodeURIComponent(release.youtubeId)}`;yt.setAttribute('aria-label',`${release.title} en YouTube`);yt.title='YouTube';yt.innerHTML=icons.youtube;platforms.appendChild(yt);}
      if(release.spotify){const sp=document.createElement('a');sp.className='music-platform';sp.href=release.spotify;sp.target='_blank';sp.rel='noopener noreferrer';sp.setAttribute('aria-label',`${release.title} en Spotify`);sp.title='Spotify';sp.innerHTML=icons.spotify;platforms.appendChild(sp);}
      row.appendChild(platforms);list.appendChild(row);
    }

    document.querySelectorAll('.accordion-toggle').forEach(button=>button.addEventListener('click',()=>{
      const panel=document.getElementById(button.getAttribute('aria-controls'));const open=button.getAttribute('aria-expanded')==='true';
      button.setAttribute('aria-expanded',String(!open));panel.hidden=open;button.querySelector('.accordion-arrow').textContent=open?'＋':'−';
    }));

    async function loadAll(){
      const status=document.getElementById('status');
      try{
        const [linksResponse,musicResponse]=await Promise.all([fetch('./links.json',{cache:'no-store'}),fetch('../music/music.json',{cache:'no-store'})]);
        if(!linksResponse.ok||!musicResponse.ok) throw new Error('No se pudieron cargar los datos');
        const [data,musicData]=await Promise.all([linksResponse.json(),musicResponse.json()]);renderProfile(data);
        const showSection=(data.sections||[]).find(s=>s.type==='shows');const shows=document.getElementById('shows');(showSection?.links||[]).filter(x=>x.active!==false).forEach(x=>renderShow(x,shows));
        const music=document.getElementById('music');(musicData.releases||[]).filter(x=>x.active!==false).forEach(x=>renderRelease(x,music));
        status.remove();
      }catch(e){status.textContent='No se pudieron cargar los links.';console.error(e);}
    }
    loadAll();
  </script>
</body>
</html>
