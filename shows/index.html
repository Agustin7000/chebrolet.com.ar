<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shows | CHEBROLET</title>
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="../links/styles.css">
</head>
<body>
  <main class="page">
    <header class="profile" id="profile"></header>
    <nav class="socials" id="socials" aria-label="Redes sociales"></nav>
    <section class="section">
      <h2 class="section-title">PRÓXIMOS SHOWS</h2>
      <div class="links" id="shows"></div>
    </section>
    <p class="status" id="status">Cargando…</p>
  </main>

  <script>
    const icons = {
      instagram: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none"/><circle cx="12" cy="12" r="4" fill="none"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>',
      tiktok: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 3v11.2a4.7 4.7 0 1 1-4-4.65v3.15a1.7 1.7 0 1 0 1 1.55V3h3Zm0 2.8c1.1 1.5 2.5 2.4 4.5 2.55v3.05A8 8 0 0 1 14 9.8Z"/></svg>',
      facebook: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.2 8.2V6.7c0-.7.5-.9 1-.9h2.3V2.2L14.4 2c-3.1 0-4.6 1.9-4.6 4.5v1.7H7v4h2.8V22h4.4v-9.8h3.2l.5-4Z"/></svg>',
      x: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3h4.7l4.25 5.67L17.8 3H20l-6.03 7.04L20.5 21h-4.7l-4.72-6.3L5.7 21H3.5l6.55-7.66L4 3Zm3.6 2 9.2 14h1.6L9.2 5H7.6Z"/></svg>',
      spotify: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.58 14.42a.75.75 0 0 1-1.03.25c-2.82-1.72-6.37-2.11-10.55-1.16a.75.75 0 1 1-.33-1.46c4.58-1.04 8.5-.59 11.66 1.34.35.22.46.68.25 1.03Zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.23-1.98-8.15-2.55-11.97-1.39a.94.94 0 1 1-.55-1.79c4.37-1.33 9.8-.69 13.5 1.58.44.27.58.85.31 1.29Zm.13-3.4C14.3 7.45 7.91 7.23 4.2 8.35a1.13 1.13 0 1 1-.65-2.16c4.26-1.29 11.32-1.03 15.78 1.62a1.13 1.13 0 0 1-1.15 1.94Z"/></svg>',
      youtube: '<svg width="28" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z"/></svg>'
    };

    function renderProfile(data) {
      const profile = document.getElementById('profile');
      if (data.profile.image) {
        const img = document.createElement('img'); img.src = data.profile.image; img.alt = `Logo de ${data.profile.name}`; profile.appendChild(img);
      }
      const h1 = document.createElement('h1'); h1.textContent = data.profile.name; profile.appendChild(h1);
      if (data.profile.tagline) { const p = document.createElement('p'); p.textContent = data.profile.tagline; profile.appendChild(p); }
      const socials = document.getElementById('socials');
      (data.socials || []).filter(x => x.active !== false).forEach(item => {
        const a = document.createElement('a'); a.className='social-link'; a.href=item.url; a.target='_blank'; a.rel='noopener noreferrer'; a.setAttribute('aria-label',item.name); a.title=item.name; a.innerHTML=icons[item.icon]||item.name; socials.appendChild(a);
      });
    }

    function renderShow(linkData, list) {
      const comingSoon = linkData.status === 'coming_soon';
      const item = document.createElement(comingSoon ? 'div' : 'a');
      item.className = `link show-link${comingSoon ? ' coming-soon' : ''}`;
      if (!comingSoon) { item.href=linkData.url; item.target='_blank'; item.rel='noopener noreferrer'; } else item.setAttribute('aria-disabled','true');
      const main=document.createElement('span'); main.className='show-main'; main.textContent=[linkData.city,linkData.date,linkData.venue].filter(Boolean).join(' · '); item.appendChild(main);
      const text=[linkData.description,comingSoon?'ENTRADAS PRÓXIMAMENTE':null].filter(Boolean).join(' · ');
      if(text){const d=document.createElement('span');d.className='show-description';d.textContent=text;item.appendChild(d);}
      list.appendChild(item);
    }

    async function loadShows(){
      const status=document.getElementById('status');
      try{
        const response=await fetch('../links/links.json',{cache:'no-store'}); if(!response.ok) throw new Error('No se pudieron cargar los shows');
        const data=await response.json(); renderProfile(data);
        const showSection=(data.sections||[]).find(s=>s.type==='shows');
        const list=document.getElementById('shows');
        (showSection?.links||[]).filter(x=>x.active!==false).forEach(x=>renderShow(x,list));
        status.remove();
      }catch(e){status.textContent='No se pudieron cargar los shows.';console.error(e);}
    }
    loadShows();
  </script>
</body>
</html>
